name: scraper

on:
  schedule:
    # 1×/día a las 08:00 UTC = 03:00 hora Panamá. Off-peak para
    # encuentra24 y bajo riesgo de coincidir con anti-bot heuristics.
    - cron: "0 8 * * *"
  workflow_dispatch: # botón manual en la UI de Actions

# Evita que dos corridas se pisen si una se pasa de duración.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 60 min: cubre encuentra24 (8-12) + acobir (2-3) + panamaequity (2-3)
    # + mlsacobir (15-20 primera vez, 2-3 después de la corrida inicial)
    # + verify (3-5) + setup (~3). Total típico ~30 min, pico ~50.
    timeout-minutes: 60

    # issues: write necesario para que `gh issue create` pueda abrir
    # tickets cuando el scraper falla o reporta errores blandos.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: Supabase JS v2 requiere WebSocket nativo (sin
          # flag desde 22). Node 20 tira: "Node.js 20 detected without
          # native WebSocket support."
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Scraper principal (encuentra24). Si falla, los otros siguen igual
      # gracias a continue-on-error: true en cada step de scrape.
      - name: Scrape encuentra24
        id: scrape
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Mapbox Geocoding API: usado para validación cruzada de
          # coords (estrategia A — solo loguea discrepancias > 2km).
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run scrape:prod

      - name: Scrape ACOBIR (proyectos nuevos)
        id: scrape-acobir
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run scrape:acobir:prod

      - name: Scrape Panama Equity
        id: scrape-pe
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run scrape:pe:prod

      - name: Scrape MLS Acobir
        id: scrape-mls
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run scrape:mls:prod

      - name: Scrape InmoPanama
        id: scrape-inmo
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run scrape:inmo:prod

      # Pase 2 del lifecycle: verifica las URLs que el scrape NO vio
      # (probablemente porque están en páginas profundas del listado).
      # Marca como activo / posible_inactivo / archivado / error_verificacion
      # según GET + JSON-LD Product. Corre si AL MENOS un scrape funcionó —
      # si todos petaron duro, la DB no se tocó y no hay nada que reconciliar.
      - name: Verificar estado (pase 2 del lifecycle)
        id: verify
        if: |
          steps.scrape.outcome == 'success' ||
          steps.scrape-acobir.outcome == 'success' ||
          steps.scrape-pe.outcome == 'success' ||
          steps.scrape-mls.outcome == 'success' ||
          steps.scrape-inmo.outcome == 'success'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:verify

      # Pase 3: deduplicación cross-source. Wipe + rebuild de la tabla
      # propiedades_duplicados. Idempotente; corre siempre (los duplicados
      # pueden venir de runs anteriores aunque hoy no scrapeara nada nuevo).
      # continue-on-error: un fallo aquí no debe tirar la corrida —
      # el frontend simplemente verá duplicados de más un día.
      - name: Deduplicar propiedades cross-source
        id: dedupe
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dedupe:prod

      # Siempre corre: si el scrape petó duro, abre issue con link al log;
      # si pasó pero scraper_runs reporta errors>0, abre issue con detalles.
      - name: Alertar (GitHub Issue) si hubo errores
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_STATUS: ${{ steps.scrape.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/scrapers/check-last-run.ts
