name: scraper

on:
  schedule:
    # 1×/día a las 08:00 UTC = 03:00 hora Panamá. Off-peak para
    # encuentra24 y bajo riesgo de coincidir con anti-bot heuristics.
    - cron: "0 8 * * *"
  workflow_dispatch: # botón manual en la UI de Actions

# Evita que dos corridas se pisen si una se pasa de duración.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 180 min: subido de 150 el 07-14 tras 3 días seguidos de cancelación
    # a los 2h35m. La corrida de hoy tardó 2h35m completa (encuentra24 16m
    # + MLS Acobir 27m + Savitat 16m + Verify 32m + InmoPanama 59m + resto)
    # → los steps post-InmoPanama (dedupe, archivar-mar, limpiar-cache,
    # presuntas-venta, alertar) quedaron skipped. Con 180 caben, y damos
    # margen para picos ocasionales de InmoPanama.
    timeout-minutes: 180

    # issues: write necesario para que `gh issue create` pueda abrir
    # tickets cuando el scraper falla o reporta errores blandos.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: Supabase JS v2 requiere WebSocket nativo (sin
          # flag desde 22). Node 20 tira: "Node.js 20 detected without
          # native WebSocket support."
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Scraper principal (encuentra24). Si falla, los otros siguen igual
      # gracias a continue-on-error: true en cada step de scrape.
      - name: Scrape encuentra24
        id: scrape
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Mapbox Geocoding API: usado para validación cruzada de
          # coords (estrategia A — solo loguea discrepancias > 2km).
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run scrape:prod

      - name: Scrape ACOBIR (proyectos nuevos)
        id: scrape-acobir
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run scrape:acobir:prod

      - name: Scrape Panama Equity
        id: scrape-pe
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run scrape:pe:prod

      - name: Scrape MLS Acobir
        id: scrape-mls
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm run scrape:mls:prod

      # Savitat = CBRE Panamá afiliado. ~150-300 URLs en sitemap, mayormente
      # comercial premium. Concurrencia 1 + jitter alto para respetar el
      # rate limit de Groq (extract-edificio). Puede tardar ~15-25 min.
      # ORDEN: Savitat va ANTES que InmoPanama (fix 2026-07-05) — InmoPanama
      # ha llegado a tomar >100 min re-procesando archivadas, y si consume
      # todo el timeout dejaba Savitat/Verify sin correr.
      - name: Scrape CBRE Panamá (Savitat)
        id: scrape-savitat
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run scrape:savitat:prod

      # Pase 2 del lifecycle: verifica las URLs que el scrape NO vio.
      # Marca como activo / posible_inactivo / archivado / error_verificacion
      # según GET + JSON-LD Product.
      # ORDEN: Verify va ANTES que InmoPanama (fix 2026-07-05) para
      # garantizar que corra aunque InmoPanama se cancele por timeout.
      # Corre si AL MENOS un scrape previo funcionó.
      - name: Verificar estado (pase 2 del lifecycle)
        id: verify
        if: |
          steps.scrape.outcome == 'success' ||
          steps.scrape-acobir.outcome == 'success' ||
          steps.scrape-pe.outcome == 'success' ||
          steps.scrape-mls.outcome == 'success' ||
          steps.scrape-savitat.outcome == 'success'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:verify

      # InmoPanama al FINAL de los scrapers — es el bottleneck (agregador
      # grande, ~9500 props en el catálogo). Si explota por timeout, los
      # demás ya corrieron. Además: fetchExistingUrls ahora saltea
      # archivadas recientes (últimos 7 días) para no re-procesar bulks
      # de limpieza.
      # if: always() — InmoPanama es un scraper independiente del verify;
      # si el circuit breaker aborta el verify, InmoPanama debe correr
      # igual (fix 2026-07-11: verify canary abort dejaba a InmoPanama
      # sin actualizar toda la corrida).
      - name: Scrape InmoPanama
        id: scrape-inmo
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run scrape:inmo:prod

      # Pase 3: deduplicación cross-source. Wipe + rebuild de la tabla
      # propiedades_duplicados. Idempotente; corre siempre (los duplicados
      # pueden venir de runs anteriores aunque hoy no scrapeara nada nuevo).
      # continue-on-error: un fallo aquí no debe tirar la corrida —
      # el frontend simplemente verá duplicados de más un día.
      - name: Deduplicar propiedades cross-source
        id: dedupe
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dedupe:prod

      # Pase 3.5: archivar props cuya coord cae en el mar. Los scrapers
      # nuevos ya validan (isOnLand), pero corremos esto por si el cache
      # de edificios devuelve algo malo o hay data histórica.
      # Idempotente + rápido (~5s), solo Supabase.
      - name: Archivar props en el mar
        id: archivar_en_mar
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run archivar-en-mar:apply

      # Pase 3.6: detectar cache entries con coord genérica (compartida
      # por >1 source_url distinto) o de dominio blacklist (wikipedia,
      # gogetit, etc.). Invalida cache + archiva props afectadas para
      # que se re-scrapeen limpio en el próximo pase.
      - name: Limpiar cache con coord duplicada
        id: limpiar_cache
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run limpiar-cache-duplicado:apply

      # Pase 4: presunta venta. Marca como presunta_venta=true las
      # archivadas que estuvieron ≥30 días activas y llevan ≥14 días
      # sin volver a verse (patrón típico de venta vs. pausa corta).
      # Idempotente + rectifica: si una prop marcada reaparece activa,
      # limpia el flag. Sin fetches externos, muy rápido (~5-10s).
      # continue-on-error + if:always: un fallo aquí es cosmético.
      - name: Marcar presuntas ventas
        id: presunta_venta
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run presunta-venta:apply

      # Siempre corre: si el scrape petó duro, abre issue con link al log;
      # si pasó pero scraper_runs reporta errors>0, abre issue con detalles.
      - name: Alertar (GitHub Issue) si hubo errores
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_STATUS: ${{ steps.scrape.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/scrapers/check-last-run.ts
